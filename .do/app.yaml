
name: yardguard-backend
static_sites: 
- name: web
  github:
    branch: main
    repo: andrewgacamac/gybe
  source_dir: /
  # We renamed admin-portal to public, so it exists in the source.
  output_dir: public 
  # Simply generate the config file in the existing directory
  build_command: |
    echo "window.YardGuardConfig = { SUPABASE_URL: '$SUPABASE_URL', SUPABASE_ANON_KEY: '$SUPABASE_ANON_KEY', SUPABASE_SERVICE_ROLE_KEY: '$SUPABASE_SERVICE_ROLE_KEY' };" > public/js/config.js 
  envs:
  - key: SUPABASE_URL
    scope: RUN_AND_BUILD_TIME
  - key: SUPABASE_ANON_KEY
    scope: RUN_AND_BUILD_TIME
  - key: SUPABASE_SERVICE_ROLE_KEY
    scope: RUN_AND_BUILD_TIME
  routes:
  - path: /
