
name: yardguard-backend
static_sites: 
- name: web
  github:
    branch: main
    repo: andrewgacamac/gybe
  source_dir: /
  # DO requires an output dir, so we create a 'public' folder and move files into it during build
  output_dir: public 
  build_command: |
    mkdir -p public
    cp -r admin-portal/* public/
    echo "window.YardGuardConfig = { SUPABASE_URL: '$SUPABASE_URL', SUPABASE_ANON_KEY: '$SUPABASE_ANON_KEY', SUPABASE_SERVICE_ROLE_KEY: '$SUPABASE_SERVICE_ROLE_KEY' };" > public/js/config.js 
  envs:
  - key: SUPABASE_URL
    scope: RUN_AND_BUILD_TIME
  - key: SUPABASE_ANON_KEY
    scope: RUN_AND_BUILD_TIME
  - key: SUPABASE_SERVICE_ROLE_KEY
    scope: RUN_AND_BUILD_TIME
  routes:
  - path: /
